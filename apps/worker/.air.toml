root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/worker/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "test", "bin", "dist"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  send_interrupt = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
